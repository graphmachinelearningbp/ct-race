name: ct-push-race
on:
  workflow_dispatch:
    inputs:
      races:
        description: "carreras validas"
        default: "100"
permissions:
  contents: write
jobs:
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Descargar el script (con gh, sin acciones)
        run: |
          gh api "repos/$GITHUB_REPOSITORY/contents/race_push.py?ref=$GITHUB_SHA" \
            -H "Accept: application/vnd.github.raw+json" > race_push.py
          head -n 3 race_push.py
      - name: Carrera de reclamos por git push
        env:
          RACES: ${{ inputs.races }}
        run: python3 race_push.py "$GITHUB_REPOSITORY"
      - name: Resumen
        if: always()
        run: |
          f=$(ls ct_push_*.jsonl 2>/dev/null | head -n 1)
          if [ -z "$f" ]; then echo "Sin resultados" >> "$GITHUB_STEP_SUMMARY"; exit 0; fi
          {
            echo '```json'
            tail -n 1 "$f"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
